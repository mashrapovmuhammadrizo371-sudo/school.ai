name: Build MySchool Android App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: mkdir -p www/icons && cp index.html script.js style.css manifest.webmanifest sw.js www/ && cp icons/icon.svg www/icons/icon.svg
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: myschool-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

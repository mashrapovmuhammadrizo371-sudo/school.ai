name: Build Signed MySchool Android AAB

on:
  workflow_dispatch:

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        working-directory: mobile
        run: npm install

      - name: Prepare web app
        working-directory: mobile
        run: npm run build:web

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Set Android release version
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace('versionName "1.0"', 'versionName "1.0.0"')
          p.write_text(s)
          PY

      - name: Sync Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Restore upload keystore
        working-directory: mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing."; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > upload-keystore.jks

      - name: Build release AAB
        working-directory: mobile/android
        run: ./gradlew bundleRelease

      - name: Sign AAB with upload key
        working-directory: mobile/android
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD secret is missing."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS secret is missing."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD secret is missing."; exit 1; }
          jarsigner             -verbose             -sigalg SHA256withRSA             -digestalg SHA-256             -keystore ../upload-keystore.jks             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEY_PASSWORD"             app/build/outputs/bundle/release/app-release.aab             "$KEY_ALIAS"

      - name: Verify signed AAB
        working-directory: mobile/android
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: MySchool-signed-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

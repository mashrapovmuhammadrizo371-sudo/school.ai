<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MySchool — STEM SCHOOL</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="intro" id="intro">
    <div class="intro__inner">

      <div class="cap" id="cap" aria-hidden="true">🎓</div>

      <h1 class="brand" id="brand">
        <span class="brand__word">STEM</span>
        <span class="brand__word">SCHOOL</span>
      </h1>

      <div class="divider" id="divider"></div>

      <button class="enter-btn" id="enterBtn" type="button">
        <span>KIRISH</span>
      </button>

    </div>
  </main>

  <main class="menu" id="menu" hidden>
    <div class="menu__inner">

      <div class="menu__header">
        <span class="menu__cap" aria-hidden="true">🎓</span>
        <span class="menu__title">STEM SCHOOL</span>
      </div>

      <nav class="menu__grid">
        <button class="menu-btn" type="button">
          <span class="menu-btn__icon">📅</span>
          <span class="menu-btn__label">JADVAL</span>
        </button>

        <button class="menu-btn" type="button">
          <span class="menu-btn__icon">📖</span>
          <span class="menu-btn__label">FANLAR</span>
        </button>

        <button class="menu-btn" type="button">
          <span class="menu-btn__icon">🎯</span>
          <span class="menu-btn__label">CAREER</span>
        </button>

        <button class="menu-btn" type="button">
          <span class="menu-btn__icon">📢</span>
          <span class="menu-btn__label">E'LON</span>
        </button>

        <button class="menu-btn" type="button">
          <span class="menu-btn__icon">📖</span>
          <span class="menu-btn__label">KITOBXONA</span>
        </button>

        <button class="menu-btn" type="button">
          <span class="menu-btn__icon">❓</span>
          <span class="menu-btn__label">INFO</span>
        </button>
      </nav>

      <button class="ai-btn" type="button">
        <span class="ai-btn__icon">🤖</span>
        <span class="ai-btn__label">AI YORDAMCHI</span>
      </button>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
